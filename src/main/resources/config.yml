# PurrtechQuest configuration

storage:
  # SQLITE (single server, default) or MYSQL (for a network of servers sharing player quest progress).
  type: SQLITE
  sqlite-file: data.db
  # Only read when type is MYSQL. Works against MySQL and MariaDB servers.
  mysql:
    host: localhost
    port: 3306
    database: purrtechquest
    username: purrtechquest
    password: ""
    pool-size: 10
    use-ssl: false

# Used when a player's client locale has no matching lang/<locale>.yml. Any file you drop into lang/
# (plugins/PurrtechQuest/lang/<code>.yml) is picked up automatically — this doesn't need to be one of the
# two bundled locales (cs/en), it's just which one a player with no matching file falls back to.
default-locale: en

# Directory (relative to the plugin's data folder) where quest definition YAML files live.
quests-directory: quests

tracking:
  # How a player's /quest track'd objective is displayed: ACTION_BAR (default, unobtrusive) or BOSS_BAR.
  display: ACTION_BAR

categories:
  # Quests with no category (or explicitly "default") normally show up directly in /quest gui as their own
  # icons, alongside your named categories' buttons. Set this to true to instead group them behind their
  # own "Others" category button, configured the same way as any category you create: /questadmin category
  # default.
  others-as-category: false

debug: false
